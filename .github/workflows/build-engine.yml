name: build-a100

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - run: |
          cat > build.sh <<'SH'
          set -e
          apt-get update -qq
          apt-get install -y -qq build-essential python3 python3-venv python3-pip git
          cd /work
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
          export CUDA_ARCHITECTURES=80
          export CMAKE_CUDA_ARCHITECTURES=80
          .venv/bin/python /ci/build.py --toolkit 13 --archs "80" --asset strata-a100.zip
          SH

          cat > build.py <<'PY'
          import argparse, json, subprocess, zipfile
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd()))
          import setup as S

          def cmake_build(src, bdir, target, defs):
              cmake, ninja = S.find_tool("cmake"), S.find_tool("ninja")
              subprocess.run([cmake, "-G", "Ninja", f"-DCMAKE_MAKE_PROGRAM={ninja}",
                            "-S", str(src), "-B", str(bdir), "-DCMAKE_BUILD_TYPE=Release", *defs], check=True)
              subprocess.run([cmake, "--build", str(bdir), "-j4"], check=True)

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--toolkit", type=int, required=True)
              ap.add_argument("--archs", required=True)
              ap.add_argument("--asset", required=True)
              a = ap.parse_args()

              ROOT = Path.cwd()
              archs = [80]
              nvcc, _ = S.find_nvcc()
              llama = S.get_llama_cpp()

              bdir = ROOT / "build"
              cmake_build(ROOT, bdir, "strata", [
                  "-DSTRATA_ENABLE_CUDA=ON", "-DSTRATA_PORTABLE=ON",
                  f"-DCMAKE_CUDA_ARCHITECTURES=80", f"-DCMAKE_CUDA_COMPILER={nvcc}",
                  *S.toolkit_root_defs(nvcc), f"-DSTRATA_GGML_DIR={llama}",
                  *S.host_compiler_defs(True), *S.engine_defs(archs, 13)])
              engine = bdir / S.EXE

              bdir_v = ROOT / "build-vision"
              cmake_build(ROOT / "tools" / "vision", bdir_v, "strata-vision", [
                  f"-DLLAMA_DIR={llama}", "-DSTRATA_VISION_CUDA=ON", "-DSTRATA_PORTABLE=ON",
                  f"-DCMAKE_CUDA_ARCHITECTURES=80", f"-DCMAKE_CUDA_COMPILER={nvcc}",
                  *S.toolkit_root_defs(nvcc), *S.host_compiler_defs(True)])
              vision = bdir_v / "bin" / S.VEXE

              Path("dist").mkdir(exist_ok=True)
              zpath = Path("dist") / a.asset
              with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as z:
                  z.write(engine, S.EXE)
                  z.write(vision, S.VEXE)
                  z.writestr("BUILD.json", json.dumps({
                      "source": "release", "version": S.source_version(),
                      "archs": archs, "vision": "gpu", "backend": "cuda", "cuda": 13
                  }, indent=1))
              print(f"Built {zpath}")

          if __name__ == "__main__":
              main()
          PY

          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$PWD:/ci:ro" \
            nvidia/cuda:13.0.0-devel-ubuntu22.04 \
            bash /ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: strata-a100
          path: dist/strata-a100.zip

      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" dist/strata-a100.zip --title "A100 Build" --notes "sm_80"
