name: Build Strata for A100 (sm_80)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-a100.yml'

jobs:
  build-a100:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install CUDA Toolkit 12.6
      uses: Jimver/cuda-toolkit@v0.2.18
      with:
        cuda: '12.6.0'
        method: 'network'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build python3 python3-venv python3-pip git

    - name: Setup Python environment
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip setuptools wheel

    - name: Build Strata for A100 (sm_80)
      run: |
        source .venv/bin/activate

        # Install PyTorch with CUDA
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121

        # Set CUDA architecture for A100
        export CUDA_ARCHITECTURES=80
        export CMAKE_CUDA_ARCHITECTURES=80
        export TORCH_CUDA_ARCH_LIST="8.0"

        # Build (without starting server)
        ./setup.sh --yes --family qwen --model IQ2_XS --no-start || true

    - name: Package build
      run: |
        tar -czf strata-a100-sm80.tar.gz \
          --exclude=.git \
          --exclude=Strata-data \
          --exclude=*.tar.gz \
          .

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: strata-a100-sm80-build
        path: strata-a100-sm80.tar.gz
        retention-days: 90

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: a100-build-${{ github.run_number }}
        name: Strata A100 Build #${{ github.run_number }}
        body: |
          ## Strata for NVIDIA A100 (sm_80)

          **Optimized for:**
          - NVIDIA A100 80GB (Compute Capability 8.0)
          - CUDA 12.6
          - Ubuntu 22.04 / Google Colab

          **Installation on Google Colab:**
          ```bash
          !wget https://github.com/${{ github.repository }}/releases/latest/download/strata-a100-sm80.tar.gz
          !tar -xzf strata-a100-sm80.tar.gz
          !cd strata-a100-sm80 && ./setup.sh --yes --family qwen --model IQ2_XS --context 131072
          ```

          **Expected Performance:**
          - Speed: 90-140 tok/s
          - Model: IQ2_XS (48GB)
          - Context: 131K tokens
        files: strata-a100-sm80.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
